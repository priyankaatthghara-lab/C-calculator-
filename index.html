<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
   <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    
    <div class="container">
        <h1>Calculator<span class="emoji">🧮</span></h1>
        <div id="display">
           <input type="text" id="myInput" />

        </div>
        <div class="button">
            <button class="newbtn">0</button>
            <button class="newbtn">1</button>
            <button class="newbtn">2</button>
            <button class="newbtn">3</button>
            <button class="newbtn">4</button>
            <button class="newbtn">5</button>
            <button class="newbtn">6</button>
             <button class="newbtn">7</button>
            <button class="newbtn">8</button>
            <button class="newbtn">9</button>
            <button class="different">+</button>
             <button class="different">-</button>
              <button class="different">*</button>
              <button class="different">%</button>
              <button class="different">C</button>
              <button class="different">=</button>





        </div>
    </div>
    
    </main>
    <script src="script.js"></script>
    
</body>
</html>
